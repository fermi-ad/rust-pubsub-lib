name: CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests-and-coverage:
    uses: fermi-ad/.github/.github/workflows/rust-integration.yaml@swb_v2
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      coverage-exclude: '|tests.rs'
      
  deploy-docs:
    needs: run-tests-and-coverage
    if: ${{ github.event_name == 'push' }}
    uses: fermi-ad/.github/.github/workflows/rust-deployment.yaml@swb_v2
    secrets: inherit 
    permissions:
      contents: write
      id-token: write
      pages: write
    with:
      docs: true 
      image: false
